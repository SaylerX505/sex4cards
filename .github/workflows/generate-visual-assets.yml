name: Generate visual documentation assets

on:
  push:
    branches:
      - readme.md
    paths:
      - 'tools/generate_visual_assets.py'
      - '.github/workflows/generate-visual-assets.yml'

permissions:
  contents: write

jobs:
  build-visual-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: readme.md
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render pixel-art PNGs
        run: python tools/generate_visual_assets.py

      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/*.png
          if git diff --cached --quiet; then
            echo "No visual asset changes."
          else
            git commit -m "Add raster pixel-art visual assets"
            git push origin HEAD:readme.md
          fi
